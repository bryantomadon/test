stages:
  - build
  - test
  - scan
  - deploy

variables:
  # Chaque image porte le numéro court du commit : on sait toujours ce qu'elle contient
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

build-image:
  stage: build
  image: docker:27                   # le client Docker
  services:
    - docker:27-dind                 # le moteur Docker, dans un conteneur voisin
  variables:
    DOCKER_HOST: "tcp://docker:2376" # où joindre le moteur
    DOCKER_TLS_CERTDIR: "/certs"     # connexion chiffrée entre client et moteur
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    # Le moteur met quelques secondes à démarrer : on l'attend
    - until docker info > /dev/null 2>&1; do sleep 1; done
    # Connexion au registre du projet, avec des identifiants fournis par GitLab pour ce job
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"

pages:
  stage: deploy
  image: alpine:3
  script:
    - mkdir -p public
    - cp -r src/. public/
  artifacts:
    paths:
      - public
  rules:
    # On ne publie que depuis la branche principale
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint-html:
  stage: test
  image: node:22-alpine
  needs: []                          # démarre tout de suite, sans attendre le build
  script:
    - npx --yes htmlhint@1.9.2 "src/**/*.html"
  allow_failure: false

sast-semgrep:
  stage: test
  image: semgrep/semgrep
  needs: []
  variables:
    SEMGREP_SEND_METRICS: "off"
  script:
    - semgrep scan --config p/default --error .
  allow_failure: false

trivy-image:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]                 # on neutralise le point d'entrée de l'image pour lancer nos commandes
  needs: [build-image]               # on scanne l'image construite par CE pipeline
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"      # Trivy doit pouvoir lire le registre
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    key: trivy-db
    paths:
      - .trivycache/                 # la base de vulnérabilités est gardée d'un pipeline à l'autre
  script:
    # 1. Tout afficher, pour information
    - trivy image --severity LOW,MEDIUM,HIGH,CRITICAL "$IMAGE"
    # 2. Bloquer uniquement sur ce qui est grave ET corrigeable
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"