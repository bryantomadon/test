stages:
  - build
  - test
  - scan
  - dynamique
  - deploy

variables:
  # Chaque image porte le numéro court du commit : on sait toujours ce qu'elle contient
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

build-image:
  stage: build
  image: docker:27                   # le client Docker
  services:
    - docker:27-dind                 # le moteur Docker, dans un conteneur voisin
  variables:
    DOCKER_HOST: "tcp://docker:2376" # où joindre le moteur
    DOCKER_TLS_CERTDIR: "/certs"     # connexion chiffrée entre client et moteur
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    # Le moteur met quelques secondes à démarrer : on l'attend
    - until docker info > /dev/null 2>&1; do sleep 1; done
    # Connexion au registre du projet, avec des identifiants fournis par GitLab pour ce job
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"

pages:
  stage: deploy
  image: alpine:3
  needs:
    - job: trivy-image
      artifacts: true                # récupère trivy.html
    - job: dast-zap
      artifacts: true                # récupère zap.html
  script:
    - mkdir -p public/reports
    - cp -r src/. public/
    - cp trivy.html zap.html public/reports/
    - |
      cat > public/reports/index.html <<HTML
      <!DOCTYPE html>
      <html lang="fr"><head><meta charset="utf-8"><title>Rapports de sécurité</title></head>
      <body>
        <h1>Rapports de sécurité</h1>
        <p>Commit ${CI_COMMIT_SHORT_SHA} — pipeline ${CI_PIPELINE_ID}</p>
        <ul>
          <li><a href="trivy.html">Scan de l'image (Trivy)</a></li>
          <li><a href="zap.html">Test dynamique (OWASP ZAP)</a></li>
        </ul>
      </body></html>
      HTML
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint-html:
  stage: test
  image: node:22-alpine
  needs: []                          # démarre tout de suite, sans attendre le build
  script:
    - npx --yes htmlhint@1.9.2 "src/**/*.html"
  allow_failure: false

sast-semgrep:
  stage: test
  image: semgrep/semgrep
  needs: []
  variables:
    SEMGREP_SEND_METRICS: "off"
  script:
    - semgrep scan --config p/default --error .
  allow_failure: false

trivy-image:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]                 # on neutralise le point d'entrée de l'image pour lancer nos commandes
  needs: [build-image]               # on scanne l'image construite par CE pipeline
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"      # Trivy doit pouvoir lire le registre
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    key: trivy-db
    paths:
      - .trivycache/                 # la base de vulnérabilités est gardée d'un pipeline à l'autre
  script:
  # 1. Le rapport complet, au format HTML (ne bloque jamais)
  - trivy image --format template --template "@/contrib/html.tpl" --output trivy.html "$IMAGE"
  # 2. La politique de sécurité (bloque si grave et corrigeable)
  - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
  artifacts:
    when: always                     # on garde le rapport même si le scan bloque
    paths:
      - trivy.html

dast-zap:
  stage: dynamique
  image: ghcr.io/zaproxy/zaproxy:stable
  needs: [build-image]
  services:
    - name: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"   # votre site, construit par ce pipeline
      alias: site                    # joignable à l'adresse http://site:8080
  script:
    - mkdir -p /zap/wrk              # ZAP écrit ses rapports dans ce dossier
    - zap-baseline.py -t http://site:8080 -r zap.html -I
  after_script:
    - cp /zap/wrk/zap.html . || true # on récupère le rapport, même si le scan a échoué
  artifacts:
    when: always
    paths:
      - zap.html
  allow_failure: true